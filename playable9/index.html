<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b130e"><title>Wonder Studio — Balance and Tension</title>
<style>
:root{--cream:#f2dfb8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17110d;color:var(--cream);font-family:Georgia,serif}body{background:radial-gradient(circle at 22% 14%,#66503b 0,#2a2018 38%,#120d09 84%)}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.top{position:fixed;left:18px;top:14px;z-index:5;text-shadow:0 3px 18px #000;pointer-events:none}.top small{font:10px Arial;letter-spacing:.2em;color:#ceb47d}.top h1{font-weight:400;margin:4px 0 1px;font-size:clamp(28px,4.7vw,52px)}.top p{margin:0;color:#d4c09a;font-style:italic;font-size:13px}.controls{position:fixed;right:14px;top:14px;z-index:6;display:flex;gap:8px}button{border:1px solid #9b754b;background:#382519dd;color:#f1ddb6;padding:9px 12px;font:13px Georgia,serif;backdrop-filter:blur(8px)}.bottom{position:fixed;left:14px;right:14px;bottom:14px;z-index:6;display:flex;gap:10px;align-items:end;pointer-events:none}.status{flex:1;max-width:790px;padding:11px 14px;background:#17110ddd;border:1px solid #7a5c3d;color:#ead8b0;font-style:italic;backdrop-filter:blur(8px)}.readout{padding:10px 13px;background:#17110ddd;border:1px solid #7a5c3d;font:12px/1.4 Arial;color:#d6c399;min-width:205px;text-align:right}.badge{position:fixed;right:16px;bottom:90px;background:#24170fd9;border:1px solid #8e6b44;padding:8px 11px;font:11px Arial;letter-spacing:.08em;color:#d9c49a}@media(max-width:700px){.top h1{font-size:30px}.top p{font-size:11px}.readout{display:none}.status{font-size:12px}.controls{top:auto;bottom:78px}.badge{display:none}}
</style></head><body>
<div class="top"><small>WONDER STUDIO</small><h1>Balance before motion</h1><p>Set the ramp. Slide the counterweight. Release the ball.</p></div><div class="controls"><button id="sound">sound: off</button><button id="reset">reset</button></div><canvas id="c" aria-label="Interactive mechanical chain with adjustable counterweight"></canvas><div class="bottom"><div id="status" class="status">Drag the ramp and the brass counterweight. The rope will tell you when the system is ready.</div><div id="readout" class="readout"></div></div><div class="badge">MECHANICAL CHAIN BENCHMARK · 09</div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),status=document.getElementById('status'),readout=document.getElementById('readout');let W,H,dpr,last=performance.now(),audio=null,sound=false,ambient=0;
const S={ramp:-.23,drag:'',weightSet:.5,ball:{s:28,v:0,r:15,released:false,air:false,x:0,y:0,vx:0,vy:0,spin:0},lever:{a:0,w:0},wheel:{a:0,w:0},cup:{y:0,v:0},weight:{y:0,v:0},tension:0,outcome:'',outcomeClock:0,impact:false};const G=980;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function ac(){audio||=new(AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.12,g=.02,type='triangle',delay=0){if(!sound)return;const a=ac(),o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+delay);v.gain.setValueAtTime(.0001,a.currentTime+delay);v.gain.exponentialRampToValueAtTime(g,a.currentTime+delay+.01);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+d);o.connect(v).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d+.03)}function noise(d=.1,g=.018,cut=900){if(!sound)return;const a=ac(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),q=b.getChannelData(0);for(let i=0;i<n;i++)q[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;v.gain.value=g;s.connect(f).connect(v).connect(a.destination);s.start()}function ambience(){clearTimeout(ambient);if(!sound)return;tone([73,98,110,147][Math.floor(Math.random()*4)],2.5,.0035,'sine');ambient=setTimeout(ambience,3400+Math.random()*2800)}document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent='sound: '+(sound?'on':'off');if(sound){ac();tone(110,.4,.018);ambience()}else clearTimeout(ambient)};
function L(){const s=clamp(W/1180,.66,1.15),b=H*.67;return{s,b,ramp:{x:W*.12,y:b-128*s,len:335*s},pivot:{x:W*.46,y:b-22*s},wheel:{x:W*.6,y:b-150*s,r:82*s},pulley:{x:W*.79,y:b-245*s,r:36*s},cupX:W*.88,weightX:W*.715,ground:b+122*s,guideTop:b-160*s,guideBottom:b+112*s}}
function rampGeom(l){const a=S.ramp,x1=l.ramp.x,y1=l.ramp.y,x2=x1+Math.cos(a)*l.ramp.len,y2=y1+Math.sin(a)*l.ramp.len;return{x1,y1,x2,y2,a,len:l.ramp.len,tx:Math.cos(a),ty:Math.sin(a),nx:-Math.sin(a),ny:Math.cos(a)}}
function reset(){Object.assign(S.ball,{s:28,v:0,released:false,air:false,vx:0,vy:0,spin:0});Object.assign(S.lever,{a:0,w:0});Object.assign(S.wheel,{a:0,w:0});Object.assign(S.cup,{y:0,v:0});Object.assign(S.weight,{y:0,v:0});S.tension=0;S.outcome='';S.outcomeClock=0;S.impact=false;status.textContent='Drag the ramp and the brass counterweight. The rope will tell you when the system is ready.';tone(120,.1,.012)}document.getElementById('reset').onclick=reset;
function ballPos(l){const r=rampGeom(l);if(!S.ball.air){S.ball.x=r.x1+r.tx*S.ball.s+r.nx*(-S.ball.r-7);S.ball.y=r.y1+r.ty*S.ball.s+r.ny*(-S.ball.r-7)}return S.ball}function ptr(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}function hit(p,a,b,r){return Math.hypot(p.x-a,p.y-b)<=r}
function weightBase(l){return l.guideTop+lerp(18*l.s,(l.guideBottom-l.guideTop)-54*l.s,S.weightSet)}
c.addEventListener('pointerdown',e=>{const p=ptr(e),l=L(),r=rampGeom(l),b=ballPos(l),wy=weightBase(l)+S.weight.y;if(hit(p,b.x,b.y,40)&&!S.ball.released){S.ball.released=true;status.textContent='Released. Watch the ball, pawl, drum, rope, and load.';tone(520,.09,.018,'sine');return}if(!S.ball.released&&hit(p,l.weightX,wy,48)){S.drag='weight';c.classList.add('dragging');c.setPointerCapture?.(e.pointerId);return}const hx=r.x1+r.tx*r.len*.82,hy=r.y1+r.ty*r.len*.82;if(!S.ball.released&&hit(p,hx,hy,72)){S.drag='ramp';c.classList.add('dragging');c.setPointerCapture?.(e.pointerId)}});
c.addEventListener('pointermove',e=>{if(!S.drag)return;const p=ptr(e),l=L();if(S.drag==='ramp'){S.ramp=clamp(Math.atan2(p.y-l.ramp.y,p.x-l.ramp.x),-.52,.02);S.ball.s=Math.min(S.ball.s,l.ramp.len-40)}else{S.weightSet=clamp((p.y-l.guideTop-18*l.s)/(l.guideBottom-l.guideTop-72*l.s),0,1);status.textContent=S.weightSet<.32?'The counterweight is high: little stored pull.':S.weightSet>.73?'The counterweight is low: the load may overpower the wheel.':'The weight sits near balance. The rope is almost ready.'}});function up(){S.drag='';c.classList.remove('dragging')}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
function update(dt){dt=Math.min(.025,dt);const l=L(),r=rampGeom(l),B=S.ball;if(B.released&&!B.air){const a=G*Math.sin(-r.a)-28*Math.sign(B.v||1);B.v=Math.max(0,B.v+a*dt);B.s+=B.v*dt;B.spin+=B.v/B.r*dt;if(B.s>r.len-18){B.air=true;B.x=r.x2+r.nx*(-B.r-7);B.y=r.y2+r.ny*(-B.r-7);B.vx=r.tx*B.v;B.vy=r.ty*B.v;noise(.12,.015,1200)}}if(B.air&&!S.outcome){B.vy+=G*dt;B.x+=B.vx*dt;B.y+=B.vy*dt;B.spin+=Math.hypot(B.vx,B.vy)/B.r*dt;const P=l.pivot,ly=P.y-14*S.lever.a,within=B.x>P.x-85&&B.x<P.x+28&&B.y+B.r>ly-12&&B.y-B.r<ly+30;if(within&&B.vy>0&&!S.impact){S.impact=true;const impact=Math.hypot(B.vx,B.vy);S.lever.w-=clamp(impact/330,1.2,3.3);B.vy=-impact*.18;B.vx*=.35;tone(150,.18,.04,'square');noise(.09,.025,650)}if(B.y>l.ground){B.y=l.ground;B.vy*=-.25;B.vx*=.7;if(Math.abs(B.vy)<25){B.vy=0;B.vx=0}}}
S.lever.w+=(-S.lever.a*17-S.lever.w*5.4)*dt;S.lever.a=clamp(S.lever.a+S.lever.w*dt,-.8,.18);const pawl=Math.max(0,-S.lever.w*1.8)+Math.max(0,-S.lever.a-.12)*1.7;const loadFactor=.42+(S.weightSet-.5)*1.25;S.wheel.w+=pawl*dt;S.wheel.w-=S.wheel.w*(.6+Math.max(0,loadFactor))*dt;S.wheel.a+=S.wheel.w*dt;const capacity=clamp(1-Math.abs(S.weightSet-.5)*1.55,.12,1),wound=Math.max(0,S.wheel.a)*35*l.s*capacity,targetWeight=clamp(wound*(.72+.4*(1-S.weightSet)),0,120*l.s),targetCup=clamp(wound*(.68+.15*S.weightSet),0,92*l.s);S.tension=clamp((Math.abs(targetWeight-S.weight.y)+Math.abs(targetCup-S.cup.y))/46,0,1);S.weight.v+=(targetWeight-S.weight.y)*17*dt-S.weight.v*7*dt;S.weight.y+=S.weight.v*dt;S.cup.v+=(targetCup-S.cup.y)*14*dt-S.cup.v*6.5*dt;S.cup.y+=S.cup.v*dt;
if(B.released&&!S.outcome){S.outcomeClock+=dt;if(S.cup.y>68*l.s){S.outcome='success';status.textContent='Balanced: impact became rotation, tension, lift, and revelation.';tone(220,.45,.035,'sine');tone(330,.65,.025,'sine',.15);tone(495,.9,.02,'sine',.3)}else if(S.outcomeClock>4.6&&Math.abs(S.wheel.w)<.05){S.outcome=S.weightSet>.68?'overload':'stall';status.textContent=S.outcome==='overload'?'Overloaded: the counterweight held the drum. Raise it and try again.':'Underpowered: the rope never became fully taut. Increase the ramp angle or lower the weight.';tone(S.outcome==='overload'?92:130,.5,.03,'sawtooth')}}}
function line(a,b,c,d,w,col){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}function circle(a,b,r,fill,stroke='#0000',sw=0){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fillStyle=fill;x.fill();if(sw){x.strokeStyle=stroke;x.lineWidth=sw;x.stroke()}}function rr(a,b,w,h,r,fill,stroke,sw=1){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=sw;x.stroke()}}function wood(a,b,w,h){const g=x.createLinearGradient(a,b,a+w,b+h);g.addColorStop(0,'#aa7248');g.addColorStop(.48,'#6d4027');g.addColorStop(1,'#b87d4e');return g}function brass(a,b,r){const g=x.createRadialGradient(a-r*.4,b-r*.45,r*.1,a,b,r);g.addColorStop(0,'#f5d77c');g.addColorStop(.42,'#c49642');g.addColorStop(1,'#654821');return g}
function background(l){x.fillStyle='#2b2018';x.fillRect(0,0,W,H);const g=x.createRadialGradient(W*.2,H*.16,20,W*.2,H*.16,W*.58);g.addColorStop(0,'#a5825055');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#765d4730';x.lineWidth=2;for(let y=95;y<H;y+=52){x.beginPath();x.moveTo(0,y);x.lineTo(W,y+Math.sin(y)*4);x.stroke()}x.fillStyle='#3d291b';x.fillRect(0,l.ground,W,H-l.ground);x.strokeStyle='#7e543655';for(let q=0;q<W;q+=92){x.beginPath();x.moveTo(q,l.ground);x.lineTo(q-45,H);x.stroke()}for(let i=0;i<34;i++){const q=(i*137+performance.now()*.004*(i%3+1))%W,y=(i*83)%H*.7;circle(q,y,1+(i%3)*.35,'#f2d9a515')}}
function drawRamp(l){const r=rampGeom(l);x.save();x.translate(r.x1,r.y1);x.rotate(r.a);x.shadowColor='#000b';x.shadowBlur=18;x.shadowOffsetY=12;rr(-18,-18,r.len+36,36,8,wood(0,-18,r.len,36),'#3d2417',4);x.shadowColor='transparent';for(let q=12;q<r.len;q+=34)line(q,-12,q+12,12,2,'#d49a6044');line(0,-26,r.len,-26,5,'#d7b180');line(0,26,r.len,26,5,'#4c2d1c');circle(0,0,13,brass(0,0,13),'#4d351b',3);x.restore();const hx=r.x1+r.tx*r.len*.82,hy=r.y1+r.ty*r.len*.82;circle(hx,hy,9,'#e1c17c','#5c4024',2)}
function drawBall(l){const B=ballPos(l);x.save();x.translate(B.x,B.y);x.rotate(B.spin);x.shadowColor='#000c';x.shadowBlur=13;x.shadowOffsetY=7;const g=x.createRadialGradient(-6,-7,2,0,0,B.r);g.addColorStop(0,'#fff');g.addColorStop(.25,'#b8eced');g.addColorStop(.68,'#46808a');g.addColorStop(1,'#17323a');circle(0,0,B.r,g,'#bddfe1',2);x.shadowColor='transparent';line(-10,0,10,0,2,'#ffffff55');line(0,-10,0,10,2,'#16374088');x.restore()}
function lever(l){const P=l.pivot;x.save();x.translate(P.x,P.y);x.rotate(S.lever.a);x.shadowColor='#000b';x.shadowBlur=14;rr(-105,-14,205,28,7,wood(-105,-14,205,28),'#3f2819',4);x.shadowColor='transparent';rr(70,-21,38,42,6,brass(88,0,30),'#4e371d',3);x.restore();circle(P.x,P.y,18,brass(P.x,P.y,18),'#483019',4);line(P.x,P.y+18,P.x-25,l.ground,13,'#6f452a')}
function wheel(l){const w=l.wheel;x.save();x.translate(w.x,w.y);x.rotate(S.wheel.a);x.shadowColor='#000b';x.shadowBlur=18;circle(0,0,w.r,brass(0,0,w.r),'#4b351d',8);circle(0,0,w.r*.69,'#3c281b','#d2ae60',7);for(let i=0;i<8;i++){x.rotate(Math.PI/4);rr(-6,-w.r*.66,12,w.r*.54,4,'#b48943','#5f4524',2)}circle(0,0,18,'#2a1d15','#e0bf70',6);x.restore();line(w.x-w.r-4,w.y,w.x+w.r+4,w.y,9,'#6e5431');const drumX=w.x+w.r*.42;circle(drumX,w.y,28*l.s,'#79562d','#e0bf70',5);for(let i=-2;i<=2;i++)circle(drumX,w.y,18*l.s+i*2.2*l.s,'#0000','#c9b38488',1)}
function guides(l){line(l.weightX-45*l.s,l.guideTop,l.weightX-45*l.s,l.guideBottom,7,'#49301f');line(l.weightX+45*l.s,l.guideTop,l.weightX+45*l.s,l.guideBottom,7,'#49301f');for(let y=l.guideTop;y<l.guideBottom;y+=34*l.s){line(l.weightX-45*l.s,y,l.weightX-31*l.s,y,3,'#b38b5233');line(l.weightX+31*l.s,y,l.weightX+45*l.s,y,3,'#b38b5233')}}
function ropes(l){const w=l.wheel,p=l.pulley,drumX=w.x+w.r*.42,wy=weightBase(l)+S.weight.y,cy=l.b-90-S.cup.y,slack=(1-S.tension)*34*l.s;x.strokeStyle=S.tension>.35?'#e3d09f':'#aa9874';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(drumX,w.y);x.quadraticCurveTo(lerp(drumX,p.x,.52),Math.min(w.y,p.y)-slack,p.x-p.r,p.y);x.arc(p.x,p.y,p.r,Math.PI,0);x.lineTo(l.cupX,cy-58);x.stroke();x.beginPath();x.moveTo(drumX,w.y+8);x.quadraticCurveTo(l.weightX-35,l.b-205+slack*.5,l.weightX,wy-48);x.stroke();for(let i=0;i<7;i++){const t=i/6,q=lerp(p.x+p.r,l.cupX,t),y=lerp(p.y,cy-58,t);line(q-3,y,q+3,y,1,'#715a3a88')}}
function pulley(l){const p=l.pulley;circle(p.x,p.y,p.r+8,'#4a3322','#2a1a11',4);circle(p.x,p.y,p.r,brass(p.x,p.y,p.r),'#6c4e26',4);circle(p.x,p.y,8,'#2c2018','#e0bf70',3);line(p.x,p.y-p.r-18,p.x,75,11,'#6a422a')}
function loads(l){const cy=l.b-90-S.cup.y,wy=weightBase(l)+S.weight.y;x.save();x.translate(l.cupX,cy);x.shadowColor='#000b';x.shadowBlur=14;x.beginPath();x.moveTo(-45,-55);x.lineTo(45,-55);x.lineTo(33,26);x.quadraticCurveTo(0,43,-33,26);x.closePath();x.fillStyle=wood(-45,-55,90,100);x.fill();x.strokeStyle='#3d2517';x.lineWidth=5;x.stroke();x.shadowColor='transparent';line(-28,-55,-18,-78,5,'#cbb98d');line(28,-55,18,-78,5,'#cbb98d');x.restore();x.save();x.translate(l.weightX,wy);x.shadowColor='#000b';x.shadowBlur=12;rr(-34,-45,68,90,9,brass(0,0,56),'#4d381e',5);x.shadowColor='transparent';circle(0,-51,10,'#7b5b2e','#e2bd65',3);line(-18,-20,18,-20,2,'#f1d98566');x.fillStyle='#3b2818';x.font='bold 12px Arial';x.textAlign='center';x.fillText(Math.round(20+S.weightSet*60)+'%',0,7);x.restore();if(!S.ball.released){x.fillStyle='#d9c28d';x.font='12px Arial';x.textAlign='center';x.fillText('DRAG WEIGHT',l.weightX,wy+66)}}
function reveal(l){let a=0;if(S.outcome==='success')a=1;else if(S.outcome)a=clamp(S.outcomeClock-4.5,0,1);if(!a)return;x.save();x.globalAlpha=ease(a);const w=Math.min(300,W*.27),h=126,q=W*.7,y=H*.22;x.shadowColor=S.outcome==='success'?'#f7d48688':'#0008';x.shadowBlur=35;rr(q,y,w,h,6,'#ddc58e','#6a4a29',3);x.shadowColor='transparent';x.fillStyle='#342216';x.font='italic 17px Georgia';const lines=S.outcome==='success'?['“Balance is not stillness.','It is forces in relationship.”']:S.outcome==='overload'?['“More weight is not','always more power.”']:['“A connection can exist','before it can transmit.”'];x.fillText(lines[0],q+20,y+38);x.fillText(lines[1],q+20,y+65);x.font='12px Arial';x.fillStyle='#65462d';x.fillText(S.outcome==='success'?'Notice slack, strain, release, and settling.':'Reset, change one variable, and watch again.',q+20,y+98);x.restore()}
function draw(){const l=L();background(l);drawRamp(l);lever(l);guides(l);wheel(l);ropes(l);pulley(l);loads(l);drawBall(l);reveal(l);const deg=Math.round(-S.ramp*180/Math.PI),label=S.weightSet<.32?'high':S.weightSet>.73?'low':'balanced';readout.innerHTML=`ramp ${deg}°<br>weight ${Math.round(S.weightSet*100)}% · ${label}<br>wheel ${S.wheel.w.toFixed(2)} rad/s<br>rope ${Math.round(S.tension*100)}% tension`}
function frame(t){const dt=(t-last)/1000;last=t;update(dt);draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
