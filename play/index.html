<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#120f0c" />
<title>Wonder Studio — Living Workshop</title>
<style>
:root{--warm:#ffd98a;--ink:#f3e4c4;--dark:#120f0c}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--dark);font-family:Georgia,"Times New Roman",serif;color:var(--ink)}#studio{position:fixed;inset:0;width:100%;height:100%;border:0;background:#17130f;opacity:0;transition:opacity 1.4s ease}body.entered #studio{opacity:1}.vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(circle at var(--mx,55%) var(--my,46%),transparent 0 14%,rgba(22,14,8,.08) 36%,rgba(5,3,2,.46) 100%);mix-blend-mode:multiply;transition:background .12s linear}.grain{position:fixed;inset:-30%;pointer-events:none;z-index:9;opacity:.065;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");animation:grain .34s steps(2) infinite}@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(0,0)}}#dust{position:fixed;inset:0;z-index:10;pointer-events:none}.particle{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,230,177,.6);box-shadow:0 0 7px rgba(255,219,147,.6);animation:drift var(--d) linear infinite;animation-delay:var(--delay)}@keyframes drift{0%{transform:translate3d(0,10vh,0);opacity:0}14%{opacity:.7}76%{opacity:.35}100%{transform:translate3d(var(--x),-112vh,0);opacity:0}}#curtain{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 61% 38%,#4c3829 0,#201813 52%,#0e0b09 100%);transition:opacity 1.25s ease,visibility 1.25s}.entered #curtain{opacity:0;visibility:hidden}.entry{width:min(560px,calc(100vw - 42px));padding:38px 30px 34px;border:1px solid rgba(217,181,116,.28);background:rgba(22,16,12,.46);box-shadow:0 30px 90px rgba(0,0,0,.5);backdrop-filter:blur(8px)}.mark{width:92px;height:92px;margin:0 auto 24px;position:relative;border:1px solid #8f7147;border-radius:50%;animation:turn 14s linear infinite}.mark:before,.mark:after{content:"";position:absolute;inset:13px;border:5px dotted #bd9650;border-radius:50%}.mark:after{inset:33px;border-style:solid;background:#76502e;box-shadow:0 0 28px rgba(255,197,95,.2)}@keyframes turn{to{transform:rotate(360deg)}}h1{margin:0;font-size:clamp(38px,7vw,68px);font-weight:400;letter-spacing:-.025em}.entry p{margin:14px auto 24px;max-width:420px;color:#c9b48d;font-style:italic;line-height:1.55}.enter{border:1px solid rgba(240,205,143,.45);background:#5e4028;color:#f5e3bf;padding:12px 20px;cursor:pointer;font:600 15px Georgia,serif;box-shadow:inset 0 1px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.3)}.enter:hover{background:#795235}.entry small{display:block;margin-top:17px;color:#927e5e;letter-spacing:.08em;text-transform:uppercase;font-size:9px}#listener{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:20;display:none;align-items:center;gap:8px;border:1px solid rgba(222,190,132,.28);background:rgba(20,15,11,.74);color:#ddcaa6;padding:8px 11px;cursor:pointer;backdrop-filter:blur(8px);font:12px Georgia,serif}.entered #listener{display:flex}#listener i{display:block;width:7px;height:7px;border-radius:50%;background:#71583a;box-shadow:0 0 0 transparent;transition:.3s}#listener.on i{background:#ffd98a;box-shadow:0 0 10px #ffc65a}.breath{position:fixed;left:50%;bottom:18px;z-index:18;transform:translateX(-50%);pointer-events:none;color:rgba(236,217,180,.72);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .7s}.breath.show{opacity:1}@media(max-width:700px){.grain{opacity:.045}.entry{padding:30px 22px}.breath{display:none}}
</style>
</head>
<body>
<iframe id="studio" title="Wonder Studio" src="../wonder-studio/" allow="fullscreen"></iframe>
<div class="vignette"></div><div class="grain"></div><div id="dust"></div>
<section id="curtain"><div class="entry"><div class="mark"></div><h1>Wonder Studio</h1><p>An unfinished workshop for unfinished ideas. Nothing here is waiting for the correct answer—only for your attention.</p><button class="enter" id="enter">Enter the workshop</button><small>Headphones recommended · drag to look · touch objects directly</small></div></section>
<button id="listener" aria-label="Toggle listening mode"><i></i><span>workshop listening</span></button>
<div id="breath" class="breath">the room is listening too</div>
<script>
const studio=document.getElementById('studio'),enter=document.getElementById('enter'),listener=document.getElementById('listener'),breath=document.getElementById('breath'),dust=document.getElementById('dust');let ctx,master,ambientOn=false,started=false;
for(let i=0;i<42;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.top=100+Math.random()*40+'%';p.style.setProperty('--d',(15+Math.random()*22)+'s');p.style.setProperty('--delay',(-Math.random()*28)+'s');p.style.setProperty('--x',(-90+Math.random()*180)+'px');p.style.opacity=.15+Math.random()*.45;dust.appendChild(p)}
addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX/innerWidth*100+'%');document.documentElement.style.setProperty('--my',e.clientY/innerHeight*100+'%')},{passive:true});
function makeAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.0001;master.connect(ctx.destination);const drone=ctx.createOscillator(),fifth=ctx.createOscillator(),g1=ctx.createGain(),g2=ctx.createGain(),filter=ctx.createBiquadFilter();drone.type='sine';fifth.type='triangle';drone.frequency.value=73.42;fifth.frequency.value=110.13;g1.gain.value=.035;g2.gain.value=.012;filter.type='lowpass';filter.frequency.value=620;drone.connect(g1).connect(filter);fifth.connect(g2).connect(filter);filter.connect(master);drone.start();fifth.start();setInterval(()=>{if(!ambientOn)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=[146.8,164.8,196,220][Math.floor(Math.random()*4)];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.008,ctx.currentTime+.6);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+3.8);o.connect(g).connect(master);o.start();o.stop(ctx.currentTime+4)},9000)}
function setAmbient(on){makeAudio();ambientOn=on;listener.classList.toggle('on',on);master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(on?.17:.0001,ctx.currentTime+1.2)}
enter.onclick=()=>{document.body.classList.add('entered');started=true;setAmbient(true);setTimeout(()=>breath.classList.add('show'),5200);setTimeout(()=>breath.classList.remove('show'),9000)};listener.onclick=()=>setAmbient(!ambientOn);
studio.addEventListener('load',()=>{try{const d=studio.contentDocument;const s=d.createElement('style');s.textContent='#title{transition:opacity 1.2s ease}body:not(:hover) #title{opacity:.72}.tool-button,.wide-button,.mini{transition:transform .16s ease,background .2s}.tool-button:hover,.wide-button:hover,.mini:hover{transform:translateY(-2px)}canvas{cursor:grab}canvas:active{cursor:grabbing}';d.head.appendChild(s);const c=d.querySelector('canvas');if(c){c.addEventListener('pointerdown',()=>{if(started&&!ambientOn)setAmbient(true)})}}catch(e){} });
</script>
</body></html>
