<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17110d"><title>Wonder Studio — A Clear Chain</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17110d;color:#ead9b8;font-family:Georgia,serif}body{background:radial-gradient(circle at 25% 18%,#5b4937 0,#281d16 42%,#100b08 100%)}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:default}.ui{position:fixed;inset:0;pointer-events:none}.title{position:absolute;left:24px;top:20px;text-shadow:0 3px 18px #000}.title small{font:10px Arial;letter-spacing:.22em;color:#cdb587}.title h1{font-weight:400;margin:5px 0 2px;font-size:clamp(27px,4vw,48px)}.title p{margin:0;color:#c8b28f;font-style:italic;font-size:13px}.actions{position:absolute;right:18px;top:18px;display:flex;gap:8px;pointer-events:auto}button{border:1px solid #856443;background:#2b1d14e8;color:#ead9b8;padding:9px 12px;font:13px Georgia,serif;cursor:pointer}.prompt{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(620px,calc(100vw - 30px));padding:12px 16px;text-align:center;background:#160f0bdc;border:1px solid #745638;color:#e6d1aa;font-style:italic;backdrop-filter:blur(8px)}.step{position:absolute;right:20px;bottom:20px;font:10px Arial;letter-spacing:.14em;color:#9e8968}@media(max-width:700px){.title{left:14px;top:12px}.title h1{font-size:28px}.title p{font-size:11px}.actions{right:10px;top:auto;bottom:78px}.step{display:none}}
</style></head><body>
<canvas id="c" aria-label="A ball rolls down a wooden ramp, strikes a lever, and turns a wheel"></canvas>
<div class="ui"><div class="title"><small>WONDER STUDIO</small><h1>Follow the force</h1><p>One cause. One transfer. One visible consequence.</p></div><div class="actions"><button id="sound">sound: off</button><button id="reset">reset</button></div><div id="prompt" class="prompt">Drag the brass handle to set the ramp. Then touch the glass ball.</div><div id="step" class="step">01 · SET THE RAMP</div></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),prompt=document.getElementById('prompt'),step=document.getElementById('step');let W,H,D,last=performance.now(),drag=false,sound=false,audio;
const S={ramp:-.28,phase:0,ball:{s:32,v:0,r:16,x:0,y:0,vx:0,vy:0,air:false,spin:0},lever:{a:0,w:0},wheel:{a:0,w:0},flash:0};const G=980,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function A(){audio||=new(AudioContext||webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.12,v=.025,type='triangle'){if(!sound)return;const a=A(),o=a.createOscillator(),q=a.createGain();o.type=type;o.frequency.value=f;q.gain.setValueAtTime(.0001,a.currentTime);q.gain.exponentialRampToValueAtTime(v,a.currentTime+.01);q.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(q).connect(a.destination);o.start();o.stop(a.currentTime+d+.03)}function thud(){if(!sound)return;const a=A(),n=a.sampleRate*.12,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),q=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=600;q.gain.value=.04;s.connect(f).connect(q).connect(a.destination);s.start()}
document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent='sound: '+(sound?'on':'off');if(sound){A();tone(110,.5,.02)}};
function L(){const z=clamp(W/1100,.72,1.1),floor=H*.75;return{z,floor,ramp:{x:W*.14,y:floor-185*z,len:365*z},pivot:{x:W*.52,y:floor-55*z},wheel:{x:W*.73,y:floor-150*z,r:92*z}}}function R(l){const a=S.ramp,x1=l.ramp.x,y1=l.ramp.y,x2=x1+Math.cos(a)*l.ramp.len,y2=y1+Math.sin(a)*l.ramp.len;return{x1,y1,x2,y2,tx:Math.cos(a),ty:Math.sin(a),nx:-Math.sin(a),ny:Math.cos(a),len:l.ramp.len}}
function reset(){S.phase=0;Object.assign(S.ball,{s:32,v:0,air:false,spin:0,vx:0,vy:0});Object.assign(S.lever,{a:0,w:0});Object.assign(S.wheel,{a:0,w:0});S.flash=0;prompt.textContent='Drag the brass handle to set the ramp. Then touch the glass ball.';step.textContent='01 · SET THE RAMP'}document.getElementById('reset').onclick=reset;
function ballPos(l){const r=R(l),b=S.ball;if(!b.air){b.x=r.x1+r.tx*b.s+r.nx*(-b.r-7);b.y=r.y1+r.ty*b.s+r.ny*(-b.r-7)}return b}function p(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}function near(p,x,y,r){return Math.hypot(p.x-x,p.y-y)<r}
c.addEventListener('pointerdown',e=>{const q=p(e),l=L(),r=R(l),b=ballPos(l),hx=r.x1+r.tx*r.len*.84,hy=r.y1+r.ty*r.len*.84;if(S.phase===0&&near(q,hx,hy,65)){drag=true;c.setPointerCapture?.(e.pointerId);return}if(S.phase===0&&near(q,b.x,b.y,44)){S.phase=1;prompt.textContent='Watch where the ball touches the lever.';step.textContent='02 · RELEASE';tone(520,.09,.018);return}if(S.phase===3)reset()});c.addEventListener('pointermove',e=>{if(!drag||S.phase!==0)return;const q=p(e),l=L();S.ramp=clamp(Math.atan2(q.y-l.ramp.y,q.x-l.ramp.x),-.5,-.08)});function up(){drag=false}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
function update(dt){dt=Math.min(dt,.025);const l=L(),r=R(l),b=S.ball;if(S.phase===1&&!b.air){const acc=G*Math.sin(-S.ramp)-32;b.v=Math.max(0,b.v+acc*dt);b.s+=b.v*dt;b.spin+=b.v/b.r*dt;if(b.s>r.len-18){b.air=true;b.x=r.x2+r.nx*(-b.r-7);b.y=r.y2+r.ny*(-b.r-7);b.vx=r.tx*b.v;b.vy=r.ty*b.v;prompt.textContent='The ball carries momentum into the next part.';step.textContent='03 · TRANSFER'}}if(b.air&&S.phase<2){b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=Math.hypot(b.vx,b.vy)/b.r*dt;const P=l.pivot,ly=P.y-12*S.lever.a;if(b.x>P.x-95&&b.x<P.x+25&&b.y+b.r>ly-10&&b.y-b.r<ly+26&&b.vy>0){S.phase=2;S.lever.w=-3.4;b.vy=-80;b.vx*=.28;S.flash=1;thud();tone(145,.18,.035,'square');prompt.textContent='Impact tips the lever. The lever pushes the wheel.';step.textContent='04 · CAUSE BECOMES EFFECT'}}
S.lever.w+=(-S.lever.a*18-S.lever.w*5.8)*dt;S.lever.a=clamp(S.lever.a+S.lever.w*dt,-.72,.16);if(S.phase>=2){const contact=Math.max(0,-S.lever.a-.12);S.wheel.w+=contact*11*dt;S.wheel.w-=S.wheel.w*1.15*dt;S.wheel.a+=S.wheel.w*dt;if(S.wheel.a>.65&&S.phase===2){S.phase=3;prompt.textContent='Clear enough to explain: ball → lever → wheel. Touch anywhere to try again.';step.textContent='05 · UNDERSTAND';tone(220,.55,.03);setTimeout(()=>tone(330,.65,.022),140)}}S.flash=Math.max(0,S.flash-dt*2.8)}
function line(x1,y1,x2,y2,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function circ(x,y,r,fill,stroke='#0000',sw=0){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=fill;g.fill();if(sw){g.strokeStyle=stroke;g.lineWidth=sw;g.stroke()}}function rr(x,y,w,h,r,fill,stroke,sw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=sw;g.stroke()}}function wood(x,y,w,h){const q=g.createLinearGradient(x,y,x+w,y+h);q.addColorStop(0,'#b27b50');q.addColorStop(.5,'#70442a');q.addColorStop(1,'#9b623d');return q}function brass(x,y,r){const q=g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);q.addColorStop(0,'#f3d77f');q.addColorStop(.48,'#b88436');q.addColorStop(1,'#5c401f');return q}
function bg(l){g.fillStyle='#241a14';g.fillRect(0,0,W,H);const q=g.createRadialGradient(W*.24,H*.2,10,W*.24,H*.2,W*.62);q.addColorStop(0,'#9a794958');q.addColorStop(1,'#0000');g.fillStyle=q;g.fillRect(0,0,W,H);g.strokeStyle='#8e6b4930';g.lineWidth=2;for(let y=100;y<H;y+=58){g.beginPath();g.moveTo(0,y);g.lineTo(W,y+3);g.stroke()}g.fillStyle='#382518';g.fillRect(0,l.floor,W,H-l.floor);for(let x=0;x<W;x+=115)line(x,l.floor,x-42,H,2,'#6f472933')}
function drawRamp(l){const r=R(l);g.save();g.translate(r.x1,r.y1);g.rotate(S.ramp);g.shadowColor='#000a';g.shadowBlur=18;g.shadowOffsetY=10;rr(-16,-18,r.len+32,36,8,wood(0,-18,r.len,36),'#3d2719',4);g.shadowColor='transparent';line(0,-26,r.len,-26,5,'#d7b17c');for(let x=20;x<r.len;x+=48)line(x,-12,x+15,11,2,'#d49a6050');circ(0,0,13,brass(0,0,13),'#3f2b19',3);g.restore();const hx=r.x1+r.tx*r.len*.84,hy=r.y1+r.ty*r.len*.84;circ(hx,hy,10,brass(hx,hy,10),'#4a321d',2);if(S.phase===0){g.font='11px Arial';g.fillStyle='#d8c08f';g.textAlign='center';g.fillText('DRAG',hx,hy+31)}}
function drawBall(l){const b=ballPos(l);g.save();g.translate(b.x,b.y);g.rotate(b.spin);g.shadowColor='#000c';g.shadowBlur=14;g.shadowOffsetY=7;const q=g.createRadialGradient(-6,-7,2,0,0,b.r);q.addColorStop(0,'#fff');q.addColorStop(.25,'#bee9ea');q.addColorStop(.7,'#4d8790');q.addColorStop(1,'#17343b');circ(0,0,b.r,q,'#c8e7e6',2);g.shadowColor='transparent';line(-11,0,11,0,2,'#ffffff55');line(0,-11,0,11,2,'#15374088');g.restore();if(S.phase===0){g.font='11px Arial';g.fillStyle='#e5d1a8';g.textAlign='center';g.fillText('TOUCH',b.x,b.y-29)}}
function drawLever(l){const P=l.pivot;g.save();g.translate(P.x,P.y);g.rotate(S.lever.a);g.shadowColor='#000b';g.shadowBlur=14;rr(-105,-13,205,26,7,wood(-105,-13,205,26),'#3c2618',4);g.shadowColor='transparent';rr(73,-20,34,40,5,brass(90,0,25),'#49331c',3);g.restore();circ(P.x,P.y,17,brass(P.x,P.y,17),'#49321c',4);line(P.x,P.y+18,P.x-28,l.floor,12,'#654027')}
function drawWheel(l){const w=l.wheel,alpha=S.phase<2?.48:1;g.save();g.globalAlpha=alpha;g.translate(w.x,w.y);g.rotate(S.wheel.a);g.shadowColor='#000b';g.shadowBlur=18;circ(0,0,w.r,brass(0,0,w.r),'#4d351d',8);circ(0,0,w.r*.7,'#352419','#d4af62',6);for(let i=0;i<6;i++){g.rotate(Math.PI/3);rr(-5,-w.r*.65,10,w.r*.52,4,'#b58a43','#5e4323',2)}circ(0,0,16,'#241811','#e1bf6f',5);g.restore();line(w.x-w.r-10,w.y,w.x+w.r+10,w.y,8,'#61492d');if(S.phase>=2){const px=l.pivot.x+88*Math.cos(S.lever.a),py=l.pivot.y+88*Math.sin(S.lever.a);line(px,py,w.x-w.r+8,w.y+20,7,S.flash?'#f0d58b':'#a88954');circ(w.x-w.r+8,w.y+20,8,'#c89d53','#4b351e',2)}}
function draw(){const l=L();bg(l);drawRamp(l);drawLever(l);drawWheel(l);drawBall(l);if(S.flash){g.fillStyle=`rgba(255,220,140,${S.flash*.12})`;g.fillRect(0,0,W,H)}}function frame(t){const dt=(t-last)/1000;last=t;update(dt);draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
