<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop Wonder — Kinetic Study 9</title>
<style>
:root{--ink:#2a1b12;--paper:#ead7aa;--card:#ad6d38;--wood:#724426;--brass:#c59b4b;--glow:#ffd879;--rope:#d5c096}*{box-sizing:border-box}body{margin:0;background:#17120f;color:var(--ink);font-family:Georgia,serif;overflow:hidden;user-select:none}.room{position:relative;width:100vw;height:100vh;min-height:650px;background:radial-gradient(circle at 73% 29%,#8c6e51 0,#5d4939 30%,#302720 76%);perspective:1000px}.planks{position:absolute;inset:0;opacity:.2;background:repeating-linear-gradient(0deg,transparent 0 44px,#211914 45px 47px)}.dust{position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(circle,rgba(255,238,195,.7) 0 1px,transparent 1.6px);background-size:91px 73px;animation:dust 20s linear infinite}@keyframes dust{to{background-position:140px 180px}}.window{position:absolute;right:5vw;top:7vh;width:23vw;height:43vh;border:16px solid #4a301f;background:linear-gradient(150deg,#a9cad0,#ecd09b 65%,#c7894b);box-shadow:inset 0 0 0 4px #a77847,0 18px 42px rgba(0,0,0,.5)}.window:before,.window:after{content:"";position:absolute;background:#503622}.window:before{left:49%;top:0;bottom:0;width:7px}.window:after{top:49%;left:0;right:0;height:7px}.distant{position:absolute;right:18%;top:27%;width:17px;height:17px;border-radius:50%;background:#4e4330;transition:1.2s}.distant.on{background:#ffe69b;box-shadow:0 0 16px 7px #ffd76b,0 0 60px 22px rgba(255,213,104,.72)}.beam{position:absolute;right:17vw;top:42vh;width:38vw;height:43vh;clip-path:polygon(31% 0,100% 0,62% 100%,0 100%);background:linear-gradient(145deg,rgba(255,224,157,.27),transparent 72%);transition:1s;pointer-events:none}.beam.on{filter:brightness(1.75);opacity:1}.bench{position:absolute;left:7vw;right:20vw;bottom:9vh;height:21vh;background:linear-gradient(#a66d3e,#654026);border-top:17px solid #bb8451;box-shadow:0 30px 38px rgba(0,0,0,.43)}.bench:before,.bench:after{content:"";position:absolute;bottom:-26vh;width:7vw;height:26vh;background:#513727}.bench:before{left:7%}.bench:after{right:8%}.machine{position:absolute;left:16vw;bottom:28vh;width:51vw;height:45vh;filter:drop-shadow(0 15px 10px rgba(0,0,0,.48));transform-origin:50% 80%}.machine.wake{animation:wake .42s ease-out}@keyframes wake{20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-1px)}80%{transform:translateX(1px)}}.board{position:absolute;left:4%;bottom:0;width:91%;height:91%;background:linear-gradient(135deg,#bd7d42,#9b5f30);border:6px solid #704122;clip-path:polygon(2% 9%,93% 0,100% 91%,7% 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.08)}.board:before{content:"";position:absolute;inset:0;opacity:.15;background:repeating-linear-gradient(17deg,transparent 0 21px,#5b321b 22px 23px)}.scribble{position:absolute;right:7%;top:7%;font:italic 14px 'Comic Sans MS',cursive;transform:rotate(-5deg);color:#4d2e1b}.note{position:absolute;left:4%;top:8%;width:154px;padding:12px;background:#e4d09f;transform:rotate(-4deg);box-shadow:4px 7px 10px rgba(0,0,0,.33);font:15px 'Comic Sans MS',cursive}.note:before{content:"";position:absolute;top:-8px;left:45px;width:60px;height:16px;background:rgba(210,187,133,.8);transform:rotate(6deg)}.ramp{position:absolute;left:4%;top:59%;width:218px;height:19px;background:linear-gradient(#98623b,#704126);border:3px solid #4d2c1a;border-radius:2px;transform-origin:10px center;transition:transform .13s;box-shadow:0 6px 0 rgba(0,0,0,.22);cursor:grab}.ramp:after{content:"";position:absolute;right:-9px;top:-8px;width:26px;height:26px;border:4px solid #c59c55;border-radius:50%;background:#674426;box-shadow:0 3px 6px rgba(0,0,0,.35)}.ramp.dragging{cursor:grabbing;filter:brightness(1.18)}.angle{position:absolute;left:5%;top:70%;font:italic 13px Georgia;color:#f1ddb8;opacity:.75}.tray{position:absolute;left:4.7%;top:47%;width:61px;height:34px;border:4px solid #76502f;border-radius:50%;background:radial-gradient(ellipse,#b78650,#694429 70%);box-shadow:inset 0 4px 8px rgba(0,0,0,.35),0 5px 7px rgba(0,0,0,.3);cursor:pointer}.tray:after{content:"place";position:absolute;left:7px;top:38px;font:italic 12px Georgia;color:#efdcb9;opacity:.65}.marble{position:absolute;left:7.2%;top:49.2%;width:29px;height:29px;border-radius:50%;background:radial-gradient(circle at 28% 23%,#fff,#7ca1a7 34%,#263d44 78%);opacity:0;z-index:5;pointer-events:none;box-shadow:0 5px 7px rgba(0,0,0,.4)}.marble.ready{opacity:1;animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{50%{filter:brightness(1.25);transform:scale(1.06)}}.marble.good{opacity:1;animation:good 1.35s ease-in forwards}.marble.miss{opacity:1;animation:miss 1.2s ease-in forwards}@keyframes good{0%{left:7.2%;top:49.2%}58%{left:36%;top:59%}82%{left:47%;top:62%}100%{left:49%;top:66%}}@keyframes miss{0%{left:7.2%;top:49.2%}70%{left:36%;top:73%}100%{left:31%;top:89%;opacity:.15}}.lever{position:absolute;left:48%;top:70%;width:99px;height:14px;background:linear-gradient(#85653a,#5d4428);transform-origin:left;transition:.34s;box-shadow:0 4px 4px rgba(0,0,0,.3)}.lever.hit{transform:rotate(25deg)}.wheel{position:absolute;left:38%;top:31%;width:144px;height:144px;border:16px solid var(--brass);border-radius:50%;box-shadow:inset 0 0 0 5px #69522d,0 7px 9px rgba(0,0,0,.35);transition:transform 1.6s cubic-bezier(.18,.68,.18,1)}.wheel:before,.wheel:after{content:"";position:absolute;left:50%;top:50%;background:#71572e;transform:translate(-50%,-50%)}.wheel:before{width:116px;height:10px}.wheel:after{height:116px;width:10px}.wheel.spin{transform:rotate(720deg)}.pulley{position:absolute;left:62%;top:10%;width:67px;height:67px;border:10px solid #8b6e3c;border-radius:50%;background:#c5a86e;box-shadow:0 5px 7px rgba(0,0,0,.35)}.pulley-target{position:absolute;left:63.2%;top:12%;width:48px;height:48px;border-radius:50%;border:2px dashed rgba(255,228,167,.2);transition:.25s;pointer-events:none}.pulley-target.hot{border-color:#ffe0a0;box-shadow:0 0 18px rgba(255,213,113,.8)}.rope-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.rope-path{fill:none;stroke:var(--rope);stroke-width:7;stroke-linecap:round;filter:drop-shadow(2px 2px 2px rgba(0,0,0,.35));transition:.2s}.rope-path.threaded{stroke:#ead9b3}.knot{position:absolute;width:31px;height:31px;border-radius:50%;border:4px solid #d8c59e;background:#75533a;box-shadow:0 4px 7px rgba(0,0,0,.38);cursor:grab;z-index:6;touch-action:none}.knot.dragging{cursor:grabbing;filter:brightness(1.25)}.cup{position:absolute;left:61%;top:69%;width:79px;height:64px;background:linear-gradient(90deg,#754324,#a86939,#754324);border:4px solid #5f361e;clip-path:polygon(7% 0,93% 0,78% 100%,22% 100%);transition:1.4s}.cup.lift{top:37%}.energy{position:absolute;left:52%;top:54%;width:12px;height:12px;border-radius:50%;background:#ffd46c;opacity:0;box-shadow:0 0 18px #ffc54b;pointer-events:none}.energy.run{animation:energy 1.25s ease-in forwards}@keyframes energy{0%{left:51%;top:64%;opacity:0}15%{opacity:1}50%{left:52%;top:43%}80%{left:64%;top:21%;opacity:1}100%{left:67%;top:34%;opacity:0}}.filament{position:absolute;left:74%;top:28%;width:92px;height:92px;border:5px dashed #735b33;border-radius:50%;opacity:.34;transition:.85s}.filament.on{opacity:1;border-color:#ffd779;box-shadow:0 0 25px #ffc64c;transform:scale(1.1) rotate(70deg)}.card{position:absolute;left:3vw;top:4vh;width:205px;background:#ddc694;padding:16px;box-shadow:5px 8px 16px rgba(0,0,0,.36);transform:rotate(-2deg);transition:.4s;z-index:8;cursor:pointer}.card.closed{height:46px;overflow:hidden}.card.used{opacity:.55}.card h2{font-size:14px;margin:0 0 13px;letter-spacing:.1em}.card p{font-size:19px;line-height:1.25;margin:0}.card small{display:block;margin-top:11px}.hud{position:absolute;left:3vw;bottom:3vh;right:3vw;display:flex;gap:13px;align-items:center;padding:12px 15px;background:rgba(29,22,17,.84);border:1px solid #80674f;color:#eddab6;box-shadow:0 8px 25px rgba(0,0,0,.4)}.status{font-style:italic;flex:1}.reset{border:1px solid #a88758;background:#5f422d;color:#f2dfba;padding:9px 13px;font:600 13px Georgia;cursor:pointer}.instruction{font-size:12px;letter-spacing:.05em;text-transform:uppercase;opacity:.72}.pulse{animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{filter:brightness(1.35);transform:scale(1.04)}}@media(max-width:820px){.machine{left:3vw;width:78vw}.window{right:2vw;width:31vw}.card{left:2vw;top:2vh}.instruction{display:none}}
</style></head>
<body><main class="room"><div class="planks"></div><div class="dust"></div><div class="window"><div id="distant" class="distant"></div></div><div id="beam" class="beam"></div><section id="card" class="card closed" tabindex="0"><h2>QUESTION CARD</h2><p>What changes when you adjust one thing at a time?</p><small>Open once. The card will not return.</small></section><div class="bench"></div><section id="machine" class="machine"><div class="board"><div class="note">The wheel moved.<br>Why didn't the cup?</div><div class="scribble">prototype 9 · follow the force</div></div><div id="ramp" class="ramp" title="Drag the brass handle"></div><div id="angle" class="angle">ramp: shallow</div><div id="tray" class="tray" title="Place or release the marble"></div><div id="marble" class="marble"></div><div id="lever" class="lever"></div><div id="wheel" class="wheel"></div><div class="pulley"></div><div id="pulleyTarget" class="pulley-target"></div><svg class="rope-svg" viewBox="0 0 1000 600" preserveAspectRatio="none"><path id="ropePath" class="rope-path" d="M665 505 Q700 400 680 260"/></svg><div id="knot" class="knot" title="Drag the rope end into the pulley groove"></div><div id="cup" class="cup"></div><div id="energy" class="energy"></div><div id="filament" class="filament"></div></section><div class="hud"><span class="instruction">Drag the ramp · drag the rope end into the pulley · use the marble tray</span><span id="status" class="status">The machine is waiting to be touched.</span><button id="reset" class="reset">Reset</button></div></main>
<script>
(()=>{const $=id=>document.getElementById(id),machine=$('machine'),ramp=$('ramp'),tray=$('tray'),knot=$('knot'),rope=$('ropePath'),target=$('pulleyTarget'),marble=$('marble'),wheel=$('wheel'),cup=$('cup'),lever=$('lever'),energy=$('energy'),filament=$('filament'),distant=$('distant'),beam=$('beam'),status=$('status'),angle=$('angle');let deg=5,threaded=false,placed=false,busy=false,ctx,kx=64.5,ky=73;
const say=t=>status.textContent=t;const audio=()=>ctx||(ctx=new(window.AudioContext||window.webkitAudioContext)());function tone(f,d=.08,type='sine',v=.05,delay=0){const c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+delay);g.gain.linearRampToValueAtTime(v,c.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.02)}function thunk(){tone(110,.12,'triangle',.08);tone(63,.16,'sine',.05)}function scrape(){tone(155,.05,'sawtooth',.018);tone(220,.04,'triangle',.012,.03)}function chime(){[220,330,440,660].forEach((f,i)=>tone(f,.7,'sine',.035,i*.16))}function wake(){machine.classList.remove('wake');void machine.offsetWidth;machine.classList.add('wake')}
function setRamp(y){const rect=machine.getBoundingClientRect(),cy=rect.top+rect.height*.59;deg=Math.max(-22,Math.min(8,Math.atan2(y-cy,210)*180/Math.PI));ramp.style.transform=`rotate(${deg}deg)`;const good=deg<-4&&deg>-13;angle.textContent=`ramp: ${good?'aligned':deg<=-13?'steep':'shallow'}`;say(good?'The track now meets the lever.':'The ramp resists at this angle. What path will the marble take?')}
let rampDrag=false;ramp.addEventListener('pointerdown',e=>{if(busy)return;rampDrag=true;ramp.classList.add('dragging');ramp.setPointerCapture(e.pointerId);tone(170,.06,'triangle',.025)});ramp.addEventListener('pointermove',e=>{if(rampDrag){setRamp(e.clientY);if(Math.random()>.7)scrape()}});ramp.addEventListener('pointerup',e=>{rampDrag=false;ramp.classList.remove('dragging');ramp.releasePointerCapture(e.pointerId);thunk()});
function drawRope(){knot.style.left=`${kx}%`;knot.style.top=`${ky}%`;const endX=kx*10+15,endY=ky*6+15;rope.setAttribute('d',threaded?`M665 505 Q690 360 650 155 Q675 120 700 155 L${endX} ${endY}`:`M665 505 Q700 410 ${endX} ${endY}`)}drawRope();let ropeDrag=false;knot.addEventListener('pointerdown',e=>{if(busy)return;ropeDrag=true;knot.classList.add('dragging');knot.setPointerCapture(e.pointerId);tone(145,.07,'triangle',.025)});knot.addEventListener('pointermove',e=>{if(!ropeDrag)return;const r=machine.getBoundingClientRect();kx=Math.max(10,Math.min(88,(e.clientX-r.left)/r.width*100));ky=Math.max(8,Math.min(82,(e.clientY-r.top)/r.height*100));const near=Math.hypot(kx-65.5,ky-16)<9;target.classList.toggle('hot',near);drawRope()});knot.addEventListener('pointerup',e=>{if(!ropeDrag)return;ropeDrag=false;knot.classList.remove('dragging');knot.releasePointerCapture(e.pointerId);const near=Math.hypot(kx-65.5,ky-16)<9;target.classList.remove('hot');if(near){threaded=true;kx=69;ky=29;rope.classList.add('threaded');drawRope();tone(245,.18,'triangle',.045);say('The rope settles into the pulley groove. Tension can now travel.')}else{threaded=false;kx=64.5;ky=73;rope.classList.remove('threaded');drawRope();tone(130,.12,'triangle',.035);say('The rope falls slack. The wheel may turn, but the cup cannot rise.')}});
function place(){placed=true;marble.className='marble ready';say('The marble rests in the launch tray. Touch the tray again to release it.');tone(520,.09,'sine',.035)}function release(){if(busy)return;busy=true;const aligned=deg<-4&&deg>-13;marble.className='marble '+(aligned?'good':'miss');tone(410,.08,'sine',.025);setTimeout(()=>{if(!aligned){thunk();wake();say('The marble misses. Its path shows what the ramp needs.');busy=false;placed=false;return}lever.classList.add('hit');wheel.classList.add('spin');energy.classList.add('run');wake();thunk();tone(95,1.3,'sawtooth',.018);say(threaded?'The lever catches. Watch the force travel through wheel, rope, and weight…':'The wheel turns—but the loose rope carries no tension.');if(threaded)setTimeout(()=>{cup.classList.add('lift');filament.classList.add('on');beam.classList.add('on');chime();say('The weight rises. Warm light crosses the room. Something distant answers.');setTimeout(()=>{distant.classList.add('on');tone(880,1.2,'sine',.025)},900)},680)},850);setTimeout(()=>busy=false,2800)}tray.onclick=()=>{if(busy)return;if(!placed)place();else release()};tray.classList.add('pulse');
$('reset').onclick=()=>{deg=5;threaded=false;placed=false;busy=false;kx=64.5;ky=73;ramp.style.transform='rotate(5deg)';angle.textContent='ramp: shallow';rope.className.baseVal='rope-path';drawRope();marble.className='marble';wheel.className='wheel';cup.className='cup';lever.className='lever';energy.className='energy';filament.className='filament';distant.className='distant';beam.className='beam';say('The machine settles. You remember what it taught you.');tone(150,.1,'triangle',.03)};
const card=$('card'),open=()=>{if(card.classList.contains('used'))return;card.classList.remove('closed');card.classList.add('used');tone(300,.12,'triangle',.025)};card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
})();
</script></body></html>
