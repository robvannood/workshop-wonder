<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop Wonder — Direct Manipulation Study</title>
<style>
:root{--ink:#2b1d13;--paper:#ead7ac;--card:#a96836;--wood:#734426;--brass:#c39a4c;--glow:#ffd87b}*{box-sizing:border-box}body{margin:0;background:#17120f;color:var(--ink);font-family:Georgia,serif;overflow:hidden;user-select:none}.room{position:relative;width:100vw;height:100vh;min-height:650px;background:radial-gradient(circle at 72% 30%,#8a6c50 0,#5b4839 28%,#302720 76%);perspective:1000px}.planks{position:absolute;inset:0;opacity:.2;background:repeating-linear-gradient(0deg,transparent 0 44px,#211914 45px 47px)}.dust{position:absolute;inset:0;pointer-events:none;opacity:.26;background-image:radial-gradient(circle,rgba(255,238,195,.75) 0 1px,transparent 1.6px);background-size:91px 73px;animation:dust 20s linear infinite}@keyframes dust{to{background-position:140px 180px}}
.window{position:absolute;right:5vw;top:7vh;width:23vw;height:43vh;border:16px solid #4a301f;background:linear-gradient(150deg,#a9cad0,#ecd09b 65%,#c7894b);box-shadow:inset 0 0 0 4px #a77847,0 18px 42px rgba(0,0,0,.5)}.window:before,.window:after{content:"";position:absolute;background:#503622}.window:before{left:49%;top:0;bottom:0;width:7px}.window:after{top:49%;left:0;right:0;height:7px}.distant{position:absolute;right:18%;top:27%;width:17px;height:17px;border-radius:50%;background:#4e4330;transition:1.2s}.distant.on{background:#ffe69b;box-shadow:0 0 16px 7px #ffd76b,0 0 60px 22px rgba(255,213,104,.72)}.beam{position:absolute;right:17vw;top:42vh;width:38vw;height:43vh;clip-path:polygon(31% 0,100% 0,62% 100%,0 100%);background:linear-gradient(145deg,rgba(255,224,157,.27),transparent 72%);transition:1s;pointer-events:none}.beam.on{filter:brightness(1.75);opacity:1}
.bench{position:absolute;left:7vw;right:20vw;bottom:9vh;height:21vh;background:linear-gradient(#a66d3e,#654026);border-top:17px solid #bb8451;box-shadow:0 30px 38px rgba(0,0,0,.43)}.bench:before,.bench:after{content:"";position:absolute;bottom:-26vh;width:7vw;height:26vh;background:#513727}.bench:before{left:7%}.bench:after{right:8%}
.machine{position:absolute;left:16vw;bottom:28vh;width:51vw;height:45vh;filter:drop-shadow(0 15px 10px rgba(0,0,0,.48))}.board{position:absolute;left:4%;bottom:0;width:91%;height:91%;background:linear-gradient(135deg,#bd7d42,#9b5f30);border:6px solid #704122;clip-path:polygon(2% 9%,93% 0,100% 91%,7% 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.08)}.board:before{content:"";position:absolute;inset:0;opacity:.15;background:repeating-linear-gradient(17deg,transparent 0 21px,#5b321b 22px 23px)}.scribble{position:absolute;right:7%;top:7%;font:italic 14px 'Comic Sans MS',cursive;transform:rotate(-5deg);color:#4d2e1b}.note{position:absolute;left:4%;top:8%;width:150px;padding:12px;background:#e4d09f;transform:rotate(-4deg);box-shadow:4px 7px 10px rgba(0,0,0,.33);font:15px 'Comic Sans MS',cursive}.note:before{content:"";position:absolute;top:-8px;left:45px;width:60px;height:16px;background:rgba(210,187,133,.8);transform:rotate(6deg)}
.ramp{position:absolute;left:4%;top:59%;width:218px;height:19px;background:linear-gradient(#98623b,#704126);border:3px solid #4d2c1a;border-radius:2px;transform-origin:10px center;transition:transform .18s;box-shadow:0 6px 0 rgba(0,0,0,.22);cursor:grab}.ramp:after{content:"";position:absolute;right:-9px;top:-8px;width:26px;height:26px;border:4px solid #c59c55;border-radius:50%;background:#674426;box-shadow:0 3px 6px rgba(0,0,0,.35)}.ramp.dragging{cursor:grabbing;filter:brightness(1.18)}.angle{position:absolute;left:5%;top:70%;font:italic 13px Georgia;color:#f1ddb8;opacity:.75}.marble{position:absolute;left:7%;top:49%;width:29px;height:29px;border-radius:50%;background:radial-gradient(circle at 28% 23%,#fff,#7ca1a7 34%,#263d44 78%);opacity:0;z-index:5;cursor:pointer;box-shadow:0 5px 7px rgba(0,0,0,.4)}.marble.ready{opacity:1;animation:breathe 1.8s ease-in-out infinite}@keyframes breathe{50%{filter:brightness(1.25);transform:scale(1.06)}}.marble.good{animation:good 1.35s ease-in forwards}.marble.miss{animation:miss 1.2s ease-in forwards}@keyframes good{0%{left:7%;top:49%}58%{left:36%;top:59%}82%{left:47%;top:62%}100%{left:49%;top:66%}}@keyframes miss{0%{left:7%;top:49%}70%{left:36%;top:73%}100%{left:31%;top:89%;opacity:.15}}
.lever{position:absolute;left:48%;top:70%;width:99px;height:14px;background:linear-gradient(#85653a,#5d4428);transform-origin:left;transition:.34s;box-shadow:0 4px 4px rgba(0,0,0,.3)}.lever.hit{transform:rotate(25deg)}.wheel{position:absolute;left:38%;top:31%;width:144px;height:144px;border:16px solid var(--brass);border-radius:50%;box-shadow:inset 0 0 0 5px #69522d,0 7px 9px rgba(0,0,0,.35);transition:transform 1.6s cubic-bezier(.18,.68,.18,1)}.wheel:before,.wheel:after{content:"";position:absolute;left:50%;top:50%;background:#71572e;transform:translate(-50%,-50%)}.wheel:before{width:116px;height:10px}.wheel:after{height:116px;width:10px}.wheel.spin{transform:rotate(720deg)}.pulley{position:absolute;left:62%;top:10%;width:67px;height:67px;border:10px solid #8b6e3c;border-radius:50%;background:#c5a86e;box-shadow:0 5px 7px rgba(0,0,0,.35)}.cord{position:absolute;left:66%;top:22%;width:7px;height:133px;background:repeating-linear-gradient(0deg,#d6c29b 0 5px,#9b805d 6px 7px);transform-origin:top;transition:.35s;cursor:grab;filter:drop-shadow(2px 2px 2px rgba(0,0,0,.35))}.cord.loose{transform:rotate(14deg)}.cord.threaded{height:199px;transform:rotate(0)}.cord:after{content:"";position:absolute;left:-10px;bottom:-13px;width:27px;height:27px;border-radius:50%;border:3px solid #d8c59e;background:#75533a}.cup{position:absolute;left:61%;top:69%;width:79px;height:64px;background:linear-gradient(90deg,#754324,#a86939,#754324);border:4px solid #5f361e;clip-path:polygon(7% 0,93% 0,78% 100%,22% 100%);transition:1.4s}.cup.lift{top:37%}.filament{position:absolute;left:74%;top:28%;width:92px;height:92px;border:5px dashed #735b33;border-radius:50%;opacity:.34;transition:.85s}.filament.on{opacity:1;border-color:#ffd779;box-shadow:0 0 25px #ffc64c;transform:scale(1.1) rotate(70deg)}
.card{position:absolute;left:3vw;top:4vh;width:205px;background:#ddc694;padding:16px;box-shadow:5px 8px 16px rgba(0,0,0,.36);transform:rotate(-2deg);transition:.4s;z-index:8;cursor:pointer}.card.closed{height:46px;overflow:hidden}.card.used{opacity:.55}.card h2{font-size:14px;margin:0 0 13px;letter-spacing:.1em}.card p{font-size:19px;line-height:1.25;margin:0}.card small{display:block;margin-top:11px}.hud{position:absolute;left:3vw;bottom:3vh;right:3vw;display:flex;gap:13px;align-items:center;padding:12px 15px;background:rgba(29,22,17,.84);border:1px solid #80674f;color:#eddab6;box-shadow:0 8px 25px rgba(0,0,0,.4)}.status{font-style:italic;flex:1}.reset{border:1px solid #a88758;background:#5f422d;color:#f2dfba;padding:9px 13px;font:600 13px Georgia;cursor:pointer}.instruction{font-size:12px;letter-spacing:.05em;text-transform:uppercase;opacity:.72}.pulse{animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{filter:brightness(1.4);transform:scale(1.04)}}
@media(max-width:820px){.machine{left:3vw;width:78vw}.window{right:2vw;width:31vw}.card{left:2vw;top:2vh}.instruction{display:none}}
</style></head><body><main class="room"><div class="planks"></div><div class="dust"></div><div class="window"><div id="distant" class="distant"></div></div><div id="beam" class="beam"></div><section id="card" class="card closed" tabindex="0"><h2>QUESTION CARD</h2><p>What changes when you adjust one thing at a time?</p><small>Open once. The card will not return.</small></section><div class="bench"></div><section class="machine"><div class="board"><div class="note">The wheel moved.<br>Why didn't the cup?</div><div class="scribble">prototype 8 · touch the machine</div></div><div id="ramp" class="ramp" title="Drag the brass handle"></div><div id="angle" class="angle">ramp: shallow</div><div id="marble" class="marble" title="Click the marble tray to place and release"></div><div id="lever" class="lever"></div><div id="wheel" class="wheel"></div><div class="pulley"></div><div id="cord" class="cord loose" title="Click or drag the cord"></div><div id="cup" class="cup"></div><div id="filament" class="filament"></div></section><div class="hud"><span class="instruction">Drag the ramp · pull the cord · click the marble</span><span id="status" class="status">The machine is waiting to be touched.</span><button id="reset" class="reset">Reset</button></div></main>
<script>
(()=>{const $=id=>document.getElementById(id),ramp=$('ramp'),cord=$('cord'),marble=$('marble'),wheel=$('wheel'),cup=$('cup'),lever=$('lever'),filament=$('filament'),distant=$('distant'),beam=$('beam'),status=$('status'),angle=$('angle');let deg=5,threaded=false,placed=false,busy=false,ctx;
const say=t=>status.textContent=t;const audio=()=>ctx||(ctx=new(window.AudioContext||window.webkitAudioContext)());function tone(f,d=.08,type='sine',v=.05,delay=0){const c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+delay);g.gain.linearRampToValueAtTime(v,c.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.02)}function thunk(){tone(110,.12,'triangle',.08);tone(63,.16,'sine',.05)}function chime(){[220,330,440,660].forEach((f,i)=>tone(f,.7,'sine',.035,i*.16))}
function setRamp(y){const rect=ramp.parentElement.getBoundingClientRect(),cy=rect.top+rect.height*.59;deg=Math.max(-22,Math.min(8,Math.atan2(y-cy,210)*180/Math.PI));ramp.style.transform=`rotate(${deg}deg)`;const good=deg<-4&&deg>-13;angle.textContent=`ramp: ${good?'aligned':deg<=-13?'steep':'shallow'}`;say(good?'The track now meets the lever.':'The ramp resists at this angle. What path will the marble take?')}
let dragging=false;ramp.addEventListener('pointerdown',e=>{if(busy)return;dragging=true;ramp.classList.add('dragging');ramp.setPointerCapture(e.pointerId);tone(170,.06,'triangle',.025)});ramp.addEventListener('pointermove',e=>{if(dragging)setRamp(e.clientY)});ramp.addEventListener('pointerup',e=>{dragging=false;ramp.classList.remove('dragging');ramp.releasePointerCapture(e.pointerId);thunk()});
function toggleCord(){if(busy)return;threaded=!threaded;cord.className='cord '+(threaded?'threaded':'loose');tone(threaded?240:145,.12,'triangle',.04);say(threaded?'The cord seats into the pulley groove.':'The cord slips loose. The wheel can turn, but it cannot lift.')};cord.onclick=toggleCord;
function place(){placed=true;marble.className='marble ready';say('The marble waits. Touch it again when you are ready.');tone(520,.09,'sine',.035)}function release(){if(busy)return;busy=true;marble.classList.remove('pulse');const aligned=deg<-4&&deg>-13;marble.className='marble '+(aligned?'good':'miss');tone(410,.08,'sine',.025);setTimeout(()=>{if(!aligned){thunk();say('The marble misses. Its path shows what the ramp needs.');busy=false;placed=false;return}lever.classList.add('hit');wheel.classList.add('spin');thunk();tone(95,1.3,'sawtooth',.018);say(threaded?'The lever catches. Motion travels into the wheel and cord…':'The wheel turns—but the loose cord transmits no lift.');if(threaded)setTimeout(()=>{cup.classList.add('lift');filament.classList.add('on');beam.classList.add('on');chime();say('The weight rises. Warm light crosses the room. Something distant answers.');setTimeout(()=>{distant.classList.add('on');tone(880,1.2,'sine',.025)},900)},650)},850);setTimeout(()=>busy=false,2700)}marble.onclick=()=>{if(!placed)place();else release()};marble.classList.add('pulse');
$('reset').onclick=()=>{deg=5;threaded=false;placed=false;busy=false;ramp.style.transform='rotate(5deg)';angle.textContent='ramp: shallow';cord.className='cord loose';marble.className='marble pulse';wheel.className='wheel';cup.className='cup';lever.className='lever';filament.className='filament';distant.className='distant';beam.className='beam';say('The machine settles. You remember what it taught you.');tone(150,.1,'triangle',.03)};
const card=$('card'),open=()=>{if(card.classList.contains('used'))return;card.classList.remove('closed');card.classList.add('used');tone(300,.12,'triangle',.025)};card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
})();</script></body></html>
