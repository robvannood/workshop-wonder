<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17110d"><title>Wonder Studio — Continuous Room</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#17110d}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#17110d;color:#ead9b8;font:italic 16px Georgia,serif;z-index:2;transition:opacity .5s}body.ready #loading{opacity:0;pointer-events:none}</style></head><body><div id="loading">Opening the continuous workshop…</div><iframe id="studio" title="Wonder Studio continuous workshop" src="../playable6/?v=2725616"></iframe><script>const frame=document.getElementById('studio');frame.addEventListener('load',()=>{try{const d=frame.contentDocument,s=d.createElement('style');s.textContent='.room{transform:translate3d(calc(0px - var(--cam)),0,0)!important}';d.head.appendChild(s);document.body.classList.add('ready')}catch(e){document.getElementById('loading').textContent='The workshop loaded, but the camera repair could not attach.'}});</script></body></html>
